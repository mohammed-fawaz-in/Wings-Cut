<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#150020"/>
      <stop offset="40%" stop-color="#3d0060"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <radialGradient id="glow" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#150020" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="75%" cy="72%" r="45%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="vign" cx="50%" cy="50%" r="75%">
      <stop offset="30%" stop-color="transparent"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.72)"/>
    </radialGradient>
    <filter id="blur2"><feGaussianBlur stdDeviation="50"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="20"/></filter>
  </defs>

  <!-- Main background -->
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Atmospheric glow -->
  <rect width="800" height="600" fill="url(#glow)"/>
  <rect width="800" height="600" fill="url(#glow2)"/>

  <!-- Style-specific content -->
  
  <!-- Crowd/hall suggestion -->
  <rect x="0" y="380" width="800" height="220" fill="rgba(0,0,0,0.3)"/>
  <!-- Stage lights from top -->
  <ellipse cx="200" cy="0" rx="60" ry="300" fill="#9333ea" opacity="0.08" filter="url(#blur2)"/>
  <ellipse cx="400" cy="0" rx="80" ry="350" fill="#fde68a" opacity="0.10" filter="url(#blur2)"/>
  <ellipse cx="600" cy="0" rx="60" ry="300" fill="#9333ea" opacity="0.08" filter="url(#blur2)"/>
  <!-- Bokeh crowd lights -->
  <circle cx="50" cy="400" r="4" fill="#9333ea" opacity="0.3"/><circle cx="95" cy="437" r="5" fill="#fde68a" opacity="0.4"/><circle cx="140" cy="474" r="6" fill="#9333ea" opacity="0.5"/><circle cx="185" cy="431" r="7" fill="#fde68a" opacity="0.6000000000000001"/><circle cx="230" cy="468" r="8" fill="#9333ea" opacity="0.3"/><circle cx="275" cy="425" r="9" fill="#fde68a" opacity="0.4"/><circle cx="320" cy="462" r="4" fill="#9333ea" opacity="0.5"/><circle cx="365" cy="419" r="5" fill="#fde68a" opacity="0.6000000000000001"/><circle cx="410" cy="456" r="6" fill="#9333ea" opacity="0.3"/><circle cx="455" cy="413" r="7" fill="#fde68a" opacity="0.4"/><circle cx="500" cy="450" r="8" fill="#9333ea" opacity="0.5"/><circle cx="545" cy="407" r="9" fill="#fde68a" opacity="0.6000000000000001"/><circle cx="590" cy="444" r="4" fill="#9333ea" opacity="0.3"/><circle cx="635" cy="401" r="5" fill="#fde68a" opacity="0.4"/><circle cx="680" cy="438" r="6" fill="#9333ea" opacity="0.5"/><circle cx="725" cy="475" r="7" fill="#fde68a" opacity="0.6000000000000001"/>
  <!-- Stage platform -->
  <rect x="150" y="280" width="500" height="100" fill="rgba(0,0,0,0.4)" rx="4"/>
  <!-- Podium/speaker suggestion -->
  <rect x="360" y="230" width="80" height="150" fill="rgba(0,0,0,0.5)" rx="2"/>
  <rect x="380" y="260" width="40" height="8" fill="#fde68a" opacity="0.6" rx="2"/>
  

  <!-- Vignette -->
  <rect width="800" height="600" fill="url(#vign)"/>

  <!-- Top red accent line -->
  <rect x="0" y="0" width="800" height="3" fill="#fde68a" opacity="0.8"/>

  <!-- Bottom info panel -->
  <rect x="0" y="488" width="800" height="112" fill="rgba(0,0,0,0.70)"/>
  <rect x="0" y="488" width="800" height="1" fill="#fde68a" opacity="0.5"/>

  <!-- Category label -->
  <rect x="36" y="510" width="3.5" height="50" fill="#fde68a" opacity="0.9" rx="2"/>
  <text x="52" y="534" font-family="Georgia,serif" font-size="21" font-weight="700"
        fill="white" letter-spacing="3.5" opacity="0.95">BIRTHDAY PARTY</text>
  <text x="52" y="558" font-family="Arial,sans-serif" font-size="13"
        fill="rgba(255,255,255,0.5)" letter-spacing="1.5">Every Moment Counts</text>

  <!-- WINGS CUT watermark -->
  <text x="764" y="530" font-family="Georgia,serif" font-size="11"
        fill="rgba(255,255,255,0.28)" letter-spacing="2" text-anchor="end">WINGS CUT</text>
  <text x="764" y="548" font-family="Arial,sans-serif" font-size="9"
        fill="rgba(255,255,255,0.18)" letter-spacing="3" text-anchor="end">STUDIO</text>

  <!-- Pulsing accent -->
  <rect x="36" y="510" width="3.5" height="50" fill="#fde68a" rx="2">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" repeatCount="indefinite"/>
  </rect>
</svg>