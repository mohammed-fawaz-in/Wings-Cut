<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080500"/>
      <stop offset="40%" stop-color="#1a1000"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <radialGradient id="glow" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#451a03" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#080500" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="75%" cy="72%" r="45%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="vign" cx="50%" cy="50%" r="75%">
      <stop offset="30%" stop-color="transparent"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.72)"/>
    </radialGradient>
    <filter id="blur2"><feGaussianBlur stdDeviation="50"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="20"/></filter>
  </defs>

  <!-- Main background -->
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Atmospheric glow -->
  <rect width="800" height="600" fill="url(#glow)"/>
  <rect width="800" height="600" fill="url(#glow2)"/>

  <!-- Style-specific content -->
  
  <!-- Horizontal film bands -->
  <rect x="0" y="0" width="800" height="70" fill="rgba(0,0,0,0.85)"/>
  <rect x="0" y="530" width="800" height="70" fill="rgba(0,0,0,0.85)"/>
  <!-- Film sprocket holes -->
  <rect x="12" y="14" width="28" height="42" fill="rgba(255,255,255,0.08)" rx="3"/><rect x="64" y="14" width="28" height="42" fill="rgba(255,255,255,0.08)" rx="3"/><rect x="116" y="14" width="28" height="42" fill="rgba(255,255,255,0.08)" rx="3"/><rect x="168" y="14" width="28" height="42" fill="rgba(255,255,255,0.08)" rx="3"/><rect x="220" y="14" width="28" height="42" fill="rgba(255,255,255,0.08)" rx="3"/><rect x="272" y="14" width="28" height="42" fill="rgba(255,255,255,0.08)" rx="3"/><rect x="324" y="14" width="28" height="42" fill="rgba(255,255,255,0.08)" rx="3"/><rect x="376" y="14" width="28" height="42" fill="rgba(255,255,255,0.08)" rx="3"/><rect x="428" y="14" width="28" height="42" fill="rgba(255,255,255,0.08)" rx="3"/><rect x="480" y="14" width="28" height="42" fill="rgba(255,255,255,0.08)" rx="3"/><rect x="532" y="14" width="28" height="42" fill="rgba(255,255,255,0.08)" rx="3"/><rect x="584" y="14" width="28" height="42" fill="rgba(255,255,255,0.08)" rx="3"/><rect x="636" y="14" width="28" height="42" fill="rgba(255,255,255,0.08)" rx="3"/><rect x="688" y="14" width="28" height="42" fill="rgba(255,255,255,0.08)" rx="3"/><rect x="740" y="14" width="28" height="42" fill="rgba(255,255,255,0.08)" rx="3"/>
  <rect x="12" y="544" width="28" height="42" fill="rgba(255,255,255,0.08)" rx="3"/><rect x="64" y="544" width="28" height="42" fill="rgba(255,255,255,0.08)" rx="3"/><rect x="116" y="544" width="28" height="42" fill="rgba(255,255,255,0.08)" rx="3"/><rect x="168" y="544" width="28" height="42" fill="rgba(255,255,255,0.08)" rx="3"/><rect x="220" y="544" width="28" height="42" fill="rgba(255,255,255,0.08)" rx="3"/><rect x="272" y="544" width="28" height="42" fill="rgba(255,255,255,0.08)" rx="3"/><rect x="324" y="544" width="28" height="42" fill="rgba(255,255,255,0.08)" rx="3"/><rect x="376" y="544" width="28" height="42" fill="rgba(255,255,255,0.08)" rx="3"/><rect x="428" y="544" width="28" height="42" fill="rgba(255,255,255,0.08)" rx="3"/><rect x="480" y="544" width="28" height="42" fill="rgba(255,255,255,0.08)" rx="3"/><rect x="532" y="544" width="28" height="42" fill="rgba(255,255,255,0.08)" rx="3"/><rect x="584" y="544" width="28" height="42" fill="rgba(255,255,255,0.08)" rx="3"/><rect x="636" y="544" width="28" height="42" fill="rgba(255,255,255,0.08)" rx="3"/><rect x="688" y="544" width="28" height="42" fill="rgba(255,255,255,0.08)" rx="3"/><rect x="740" y="544" width="28" height="42" fill="rgba(255,255,255,0.08)" rx="3"/>
  <!-- Scene suggestion - city/landscape -->
  <rect x="0" y="70" width="800" height="460" fill="rgba(0,0,0,0.2)"/>
  <!-- Building silhouettes -->
  <rect x="0" y="200" width="80" height="330" fill="rgba(0,0,0,0.5)"/>
  <rect x="90" y="280" width="60" height="250" fill="rgba(0,0,0,0.45)"/>
  <rect x="600" y="240" width="90" height="290" fill="rgba(0,0,0,0.5)"/>
  <rect x="700" y="300" width="100" height="230" fill="rgba(0,0,0,0.45)"/>
  <!-- Windows in buildings -->
  <rect x="10" y="210" width="10" height="14" fill="#451a03" opacity="0.15"/><rect x="28" y="210" width="10" height="14" fill="#d97706" opacity="0.15"/><rect x="46" y="210" width="10" height="14" fill="#d97706" opacity="0.15"/><rect x="64" y="210" width="10" height="14" fill="#451a03" opacity="0.15"/><rect x="10" y="238" width="10" height="14" fill="#d97706" opacity="0.15"/><rect x="28" y="238" width="10" height="14" fill="#d97706" opacity="0.25"/><rect x="46" y="238" width="10" height="14" fill="#451a03" opacity="0.35"/><rect x="64" y="238" width="10" height="14" fill="#d97706" opacity="0.15"/><rect x="10" y="266" width="10" height="14" fill="#d97706" opacity="0.15"/><rect x="28" y="266" width="10" height="14" fill="#451a03" opacity="0.35"/><rect x="46" y="266" width="10" height="14" fill="#d97706" opacity="0.25"/><rect x="64" y="266" width="10" height="14" fill="#d97706" opacity="0.15"/><rect x="10" y="294" width="10" height="14" fill="#451a03" opacity="0.15"/><rect x="28" y="294" width="10" height="14" fill="#d97706" opacity="0.15"/><rect x="46" y="294" width="10" height="14" fill="#d97706" opacity="0.15"/><rect x="64" y="294" width="10" height="14" fill="#451a03" opacity="0.15"/><rect x="10" y="322" width="10" height="14" fill="#d97706" opacity="0.15"/><rect x="28" y="322" width="10" height="14" fill="#d97706" opacity="0.25"/><rect x="46" y="322" width="10" height="14" fill="#451a03" opacity="0.35"/><rect x="64" y="322" width="10" height="14" fill="#d97706" opacity="0.15"/><rect x="10" y="350" width="10" height="14" fill="#d97706" opacity="0.15"/><rect x="28" y="350" width="10" height="14" fill="#451a03" opacity="0.35"/><rect x="46" y="350" width="10" height="14" fill="#d97706" opacity="0.25"/><rect x="64" y="350" width="10" height="14" fill="#d97706" opacity="0.15"/><rect x="10" y="378" width="10" height="14" fill="#451a03" opacity="0.15"/><rect x="28" y="378" width="10" height="14" fill="#d97706" opacity="0.15"/><rect x="46" y="378" width="10" height="14" fill="#d97706" opacity="0.15"/><rect x="64" y="378" width="10" height="14" fill="#451a03" opacity="0.15"/><rect x="10" y="406" width="10" height="14" fill="#d97706" opacity="0.15"/><rect x="28" y="406" width="10" height="14" fill="#d97706" opacity="0.25"/><rect x="46" y="406" width="10" height="14" fill="#451a03" opacity="0.35"/><rect x="64" y="406" width="10" height="14" fill="#d97706" opacity="0.15"/>
  <!-- Moon/sun -->
  <circle cx="580" cy="160" r="45" fill="#d97706" opacity="0.18" filter="url(#blur2)"/>
  <circle cx="580" cy="160" r="30" fill="#d97706" opacity="0.12"/>
  <!-- Lens flare -->
  <ellipse cx="580" cy="160" rx="200" ry="4" fill="#d97706" opacity="0.08"/>
  

  <!-- Vignette -->
  <rect width="800" height="600" fill="url(#vign)"/>

  <!-- Top red accent line -->
  <rect x="0" y="0" width="800" height="3" fill="#d97706" opacity="0.8"/>

  <!-- Bottom info panel -->
  <rect x="0" y="488" width="800" height="112" fill="rgba(0,0,0,0.70)"/>
  <rect x="0" y="488" width="800" height="1" fill="#d97706" opacity="0.5"/>

  <!-- Category label -->
  <rect x="36" y="510" width="3.5" height="50" fill="#d97706" opacity="0.9" rx="2"/>
  <text x="52" y="534" font-family="Georgia,serif" font-size="21" font-weight="700"
        fill="white" letter-spacing="3.5" opacity="0.95">DOCUMENTARY</text>
  <text x="52" y="558" font-family="Arial,sans-serif" font-size="13"
        fill="rgba(255,255,255,0.5)" letter-spacing="1.5">Real Stories</text>

  <!-- WINGS CUT watermark -->
  <text x="764" y="530" font-family="Georgia,serif" font-size="11"
        fill="rgba(255,255,255,0.28)" letter-spacing="2" text-anchor="end">WINGS CUT</text>
  <text x="764" y="548" font-family="Arial,sans-serif" font-size="9"
        fill="rgba(255,255,255,0.18)" letter-spacing="3" text-anchor="end">STUDIO</text>

  <!-- Pulsing accent -->
  <rect x="36" y="510" width="3.5" height="50" fill="#d97706" rx="2">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" repeatCount="indefinite"/>
  </rect>
</svg>