  <rect x="680" y="455" width="90" height="60" fill="rgba(20,10,40,0.8)" rx="3"/>
  <rect x="680" y="455" width="90" height="16" fill="rgba(255,255,255,0.12)" rx="3"/>
  <line x1="697" y1="455" x2="697" y2="471" stroke="rgba(0,0,0,0.5)" stroke-width="2"/>
  <line x1="714" y1="455" x2="714" y2="471" stroke="rgba(0,0,0,0.5)" stroke-width="2"/>
