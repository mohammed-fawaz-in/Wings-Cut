<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">

  <defs>
    <linearGradient id="cin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="50%" stop-color="#050515"/>
      <stop offset="100%" stop-color="#0a0520"/>
    </linearGradient>
    <radialGradient id="citylight" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ff6b35" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="moon" cx="72%" cy="22%" r="8%">
      <stop offset="0%" stop-color="#e8e8d0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <filter id="sb4"><feGaussianBlur stdDeviation="35"/></filter>
    <filter id="glow4"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="vign" cx="50%" cy="50%" r="70%"><stop offset="30%" stop-color="transparent"/><stop offset="100%" stop-color="rgba(0,0,0,0.80)"/></radialGradient>
  </defs>
