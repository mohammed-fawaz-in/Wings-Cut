<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">

  <defs>
    <linearGradient id="bd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0010"/>
      <stop offset="50%" stop-color="#4a0030"/>
      <stop offset="100%" stop-color="#8B0050"/>
    </linearGradient>
    <radialGradient id="spotlight2" cx="40%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#ff9eb5" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="rim2" cx="90%" cy="35%" r="35%">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <filter id="glow2"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="sb2"><feGaussianBlur stdDeviation="40"/></filter>
    <radialGradient id="vign" cx="50%" cy="50%" r="70%"><stop offset="30%" stop-color="transparent"/><stop offset="100%" stop-color="rgba(0,0,0,0.78)"/></radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bd)"/>
  <rect width="800" height="600" fill="url(#spotlight2)"/>
  <rect width="800" height="600" fill="url(#rim2)"/>
  <!-- Bokeh background -->
  <circle cx="120" cy="100" r="45" fill="#ff6b9d" opacity="0.06" filter="url(#sb2)"/>
  <circle cx="700" cy="150" r="60" fill="#ffd700" opacity="0.07" filter="url(#sb2)"/>
  <circle cx="650" cy="500" r="50" fill="#ff9eb5" opacity="0.06" filter="url(#sb2)"/>
  <!-- Bride face and head -->
  <circle cx="390" cy="185" r="82" fill="#c68642" opacity="0.85"/>
  <!-- Forehead bindi -->
  <circle cx="390" cy="148" r="5" fill="#8B0000" opacity="0.95" filter="url(#glow2)"/>
  <!-- Maang tikka chain -->
  <path d="M 340 155 Q 365 140 390 148 Q 415 140 440 155" stroke="#ffd700" stroke-width="2" fill="none" opacity="0.8"/>
  <circle cx="340" cy="155" r="4" fill="#ffd700" opacity="0.9"/>
  <circle cx="440" cy="155" r="4" fill="#ffd700" opacity="0.9"/>
  <!-- Hair - elaborate bun with flowers -->
  <ellipse cx="390" cy="118" rx="90" ry="52" fill="#1a0a00" opacity="0.95"/>
  <ellipse cx="390" cy="100" rx="75" ry="38" fill="#150800" opacity="0.9"/>
  <!-- Hair flowers -->
  <circle cx="340" cy="110" r="7" fill="#ff6b9d" opacity="0.8"/>
  <circle cx="360" cy="98" r="5" fill="#fff" opacity="0.7"/>
  <circle cx="420" cy="102" r="6" fill="#ff6b9d" opacity="0.8"/>
  <circle cx="445" cy="114" r="5" fill="#fff" opacity="0.7"/>
  <!-- Earrings -->
  <line x1="310" y1="185" x2="302" y2="230" stroke="#ffd700" stroke-width="2" opacity="0.9"/>
  <circle cx="302" cy="235" r="6" fill="#ffd700" opacity="0.9"/>
  <circle cx="302" cy="248" r="4" fill="#e53935" opacity="0.9"/>
  <line x1="470" y1="185" x2="478" y2="230" stroke="#ffd700" stroke-width="2" opacity="0.9"/>
  <circle cx="478" cy="235" r="6" fill="#ffd700" opacity="0.9"/>
  <circle cx="478" cy="248" r="4" fill="#e53935" opacity="0.9"/>
  <!-- Eyes - almond shaped -->
  <ellipse cx="364" cy="183" rx="16" ry="8" fill="#1a0800" opacity="0.9"/>
  <ellipse cx="416" cy="183" rx="16" ry="8" fill="#1a0800" opacity="0.9"/>
  <!-- Kajal/eyeliner -->
  <path d="M 348 183 Q 364 176 380 183" stroke="#000" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M 400 183 Q 416 176 432 183" stroke="#000" stroke-width="2" fill="none" opacity="0.8"/>
  <!-- Eye catchlight -->
  <circle cx="368" cy="181" r="4" fill="#fff" opacity="0.6"/>
  <circle cx="420" cy="181" r="4" fill="#fff" opacity="0.6"/>
  <!-- Nose ring -->
  <circle cx="400" cy="210" r="5" fill="none" stroke="#ffd700" stroke-width="1.5" opacity="0.9"/>
  <!-- Lips -->
  <path d="M 370 222 Q 390 232 410 222 Q 400 216 390 218 Q 380 216 370 222 Z" fill="#c41e3a" opacity="0.9"/>
  <!-- Neck -->
  <rect x="368" y="264" width="44" height="60" fill="#c68642" opacity="0.8" rx="8"/>
  <!-- Necklace -->
  <path d="M 330 280 Q 390 310 450 280" stroke="#ffd700" stroke-width="3" fill="none" opacity="0.85"/>
  <circle cx="390" cy="310" r="8" fill="#ffd700" opacity="0.9"/>
  <circle cx="360" cy="295" r="5" fill="#e53935" opacity="0.8"/>
  <circle cx="420" cy="295" r="5" fill="#e53935" opacity="0.8"/>
  <!-- Lehenga choli top -->
  <path d="M 260 330 Q 390 355 520 330 L 540 600 L 240 600 Z" fill="#8B0000" opacity="0.75"/>
  <!-- Zari/embroidery on blouse -->
  <path d="M 300 340 Q 390 360 480 340" stroke="#ffd700" stroke-width="1.5" fill="none" opacity="0.5"/>
  <circle cx="350" cy="345" r="2" fill="#ffd700" opacity="0.6"/>
  <circle cx="390" cy="350" r="2" fill="#ffd700" opacity="0.6"/>
  <circle cx="430" cy="345" r="2" fill="#ffd700" opacity="0.6"/>
  <!-- Bangles on wrists -->
  <ellipse cx="270" cy="420" rx="18" ry="8" fill="none" stroke="#ffd700" stroke-width="3" opacity="0.7"/>
  <ellipse cx="270" cy="428" rx="18" ry="8" fill="none" stroke="#c41e3a" stroke-width="2" opacity="0.6"/>
  <ellipse cx="510" cy="420" rx="18" ry="8" fill="none" stroke="#ffd700" stroke-width="3" opacity="0.7"/>
  <ellipse cx="510" cy="428" rx="18" ry="8" fill="none" stroke="#c41e3a" stroke-width="2" opacity="0.6"/>
  <!-- Dupatta/veil flowing -->
  <path d="M 300 150 Q 240 250 220 400 Q 210 450 230 500" stroke="#ff9eb5" stroke-width="35" fill="none" opacity="0.25" stroke-linecap="round"/>
  
  <!-- Vignette overlay -->
  <rect width="800" height="600" fill="url(#vign)"/>
  <!-- Top accent -->
  <rect x="0" y="0" width="800" height="3" fill="#ff9eb5" opacity="0.85"/>
  <!-- Bottom label panel -->
  <rect x="0" y="488" width="800" height="112" fill="rgba(0,0,0,0.72)"/>
  <rect x="0" y="488" width="800" height="1.5" fill="#ff9eb5" opacity="0.55"/>
  <!-- Accent bar -->
  <rect x="36" y="508" width="3.5" height="52" fill="#ff9eb5" opacity="0.9" rx="2">
    <animate attributeName="opacity" values="0.45;1;0.45" dur="2.8s" repeatCount="indefinite"/>
  </rect>
  <!-- Title -->
  <text x="52" y="534" font-family="Georgia,serif" font-size="21" font-weight="700"
        fill="white" letter-spacing="3" opacity="0.95">BRIDAL PORTRAIT</text>
  <text x="52" y="558" font-family="Arial,sans-serif" font-size="13"
        fill="rgba(255,255,255,0.52)" letter-spacing="1.5">Timeless Elegance</text>
  <!-- Watermark -->
  <text x="764" y="530" font-family="Georgia,serif" font-size="11"
        fill="rgba(255,255,255,0.3)" letter-spacing="2" text-anchor="end">WINGS CUT</text>
  <text x="764" y="548" font-family="Arial,sans-serif" font-size="9"
        fill="rgba(255,255,255,0.2)" letter-spacing="3" text-anchor="end">STUDIO</text>
</svg>