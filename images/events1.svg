<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">

  <defs>
    <linearGradient id="hall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0015"/>
      <stop offset="40%" stop-color="#150030"/>
      <stop offset="100%" stop-color="#200040"/>
    </linearGradient>
    <radialGradient id="stage_light1" cx="25%" cy="0%" r="45%">
      <stop offset="0%" stop-color="#5b21b6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="stage_light2" cx="75%" cy="0%" r="45%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="stage_light3" cx="50%" cy="0%" r="40%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <filter id="sb3"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="glow3"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="vign" cx="50%" cy="50%" r="70%"><stop offset="30%" stop-color="transparent"/><stop offset="100%" stop-color="rgba(0,0,0,0.72)"/></radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#hall)"/>
  <rect width="800" height="600" fill="url(#stage_light1)"/>
  <rect width="800" height="600" fill="url(#stage_light2)"/>
  <rect width="800" height="600" fill="url(#stage_light3)"/>
  <!-- Stage platform -->
  <rect x="60" y="320" width="680" height="180" fill="rgba(20,10,40,0.85)"/>
  <rect x="60" y="318" width="680" height="6" fill="rgba(150,100,255,0.4)"/>
  <!-- LED screen backdrop -->
  <rect x="100" y="40" width="600" height="280" fill="rgba(10,5,30,0.9)" rx="4"/>
  <rect x="104" y="44" width="592" height="272" fill="rgba(30,15,60,0.8)" rx="3"/>
  <!-- Screen content - company logo suggestion -->
  <rect x="280" y="120" width="240" height="120" fill="rgba(91,33,182,0.3)" rx="8"/>
  <rect x="300" y="140" width="200" height="4" fill="rgba(255,255,255,0.5)" rx="2"/>
  <rect x="320" y="155" width="160" height="3" fill="rgba(255,255,255,0.3)" rx="2"/>
  <rect x="310" y="168" width="180" height="3" fill="rgba(255,255,255,0.3)" rx="2"/>
  <!-- Stage spotlights from ceiling -->
  <path d="M 200 0 L 160 320 L 220 320 Z" fill="rgba(91,33,182,0.08)"/>
  <path d="M 400 0 L 360 320 L 440 320 Z" fill="rgba(100,50,200,0.10)"/>
  <path d="M 600 0 L 570 320 L 640 320 Z" fill="rgba(37,99,235,0.08)"/>
  <!-- Spotlight cones -->
  <ellipse cx="190" cy="320" rx="30" ry="8" fill="rgba(91,33,182,0.4)"/>
  <ellipse cx="400" cy="320" rx="36" ry="9" fill="rgba(124,58,237,0.45)"/>
  <ellipse cx="610" cy="320" rx="30" ry="8" fill="rgba(37,99,235,0.4)"/>
  <!-- Speaker at podium -->
  <rect x="360" y="230" width="80" height="95" fill="rgba(15,8,30,0.9)" rx="3"/>
  <rect x="372" y="248" width="56" height="6" fill="rgba(150,100,255,0.6)" rx="2"/>
  <!-- Speaker silhouette -->
  <circle cx="400" cy="218" r="22" fill="rgba(40,20,60,0.9)"/>
  <rect x="385" y="238" width="30" height="60" fill="rgba(30,15,50,0.85)"/>
  <!-- Microphone -->
  <rect x="398" y="244" width="4" height="20" fill="rgba(200,200,200,0.5)"/>
  <circle cx="400" cy="242" r="4" fill="rgba(200,200,200,0.6)"/>
  <!-- Audience rows - people silhouettes -->
  <rect x="0" y="500" width="800" height="100" fill="rgba(5,2,15,0.9)"/>
  <!-- Row 1 heads -->
  <circle cx="60" cy="490" r="14" fill="rgba(20,10,40,0.9)"/>
  <circle cx="120" cy="492" r="13" fill="rgba(20,10,40,0.9)"/>
  <circle cx="180" cy="488" r="14" fill="rgba(20,10,40,0.9)"/>
  <circle cx="240" cy="491" r="13" fill="rgba(20,10,40,0.9)"/>
  <circle cx="300" cy="489" r="15" fill="rgba(20,10,40,0.9)"/>
  <circle cx="360" cy="492" r="13" fill="rgba(20,10,40,0.9)"/>
  <circle cx="420" cy="488" r="14" fill="rgba(20,10,40,0.9)"/>
  <circle cx="480" cy="491" r="13" fill="rgba(20,10,40,0.9)"/>
  <circle cx="540" cy="489" r="14" fill="rgba(20,10,40,0.9)"/>
  <circle cx="600" cy="492" r="15" fill="rgba(20,10,40,0.9)"/>
  <circle cx="660" cy="488" r="13" fill="rgba(20,10,40,0.9)"/>
  <circle cx="720" cy="491" r="14" fill="rgba(20,10,40,0.9)"/>
  <!-- Phone screens in audience (people recording) -->
  <rect x="95" y="470" width="8" height="12" fill="rgba(200,230,255,0.6)" rx="1"/>
  <rect x="295" y="468" width="8" height="12" fill="rgba(200,230,255,0.5)" rx="1"/>
  <rect x="595" y="470" width="8" height="12" fill="rgba(200,230,255,0.6)" rx="1"/>
  <!-- Truss/rigging at top -->
  <rect x="0" y="0" width="800" height="18" fill="rgba(20,10,40,0.95)"/>
  <line x1="100" y1="0" x2="100" y2="18" stroke="rgba(150,100,255,0.3)" stroke-width="2"/>
  <line x1="200" y1="0" x2="200" y2="18" stroke="rgba(150,100,255,0.3)" stroke-width="2"/>
  <line x1="300" y1="0" x2="300" y2="18" stroke="rgba(150,100,255,0.3)" stroke-width="2"/>
  <line x1="400" y1="0" x2="400" y2="18" stroke="rgba(150,100,255,0.3)" stroke-width="2"/>
  <line x1="500" y1="0" x2="500" y2="18" stroke="rgba(150,100,255,0.3)" stroke-width="2"/>
  <line x1="600" y1="0" x2="600" y2="18" stroke="rgba(150,100,255,0.3)" stroke-width="2"/>
  <line x1="700" y1="0" x2="700" y2="18" stroke="rgba(150,100,255,0.3)" stroke-width="2"/>
  
  <!-- Vignette overlay -->
  <rect width="800" height="600" fill="url(#vign)"/>
  <!-- Top accent -->
  <rect x="0" y="0" width="800" height="3" fill="#7c3aed" opacity="0.85"/>
  <!-- Bottom label panel -->
  <rect x="0" y="488" width="800" height="112" fill="rgba(0,0,0,0.72)"/>
  <rect x="0" y="488" width="800" height="1.5" fill="#7c3aed" opacity="0.55"/>
  <!-- Accent bar -->
  <rect x="36" y="508" width="3.5" height="52" fill="#7c3aed" opacity="0.9" rx="2">
    <animate attributeName="opacity" values="0.45;1;0.45" dur="2.8s" repeatCount="indefinite"/>
  </rect>
  <!-- Title -->
  <text x="52" y="534" font-family="Georgia,serif" font-size="21" font-weight="700"
        fill="white" letter-spacing="3" opacity="0.95">CORPORATE EVENT</text>
  <text x="52" y="558" font-family="Arial,sans-serif" font-size="13"
        fill="rgba(255,255,255,0.52)" letter-spacing="1.5">Professional & Polished</text>
  <!-- Watermark -->
  <text x="764" y="530" font-family="Georgia,serif" font-size="11"
        fill="rgba(255,255,255,0.3)" letter-spacing="2" text-anchor="end">WINGS CUT</text>
  <text x="764" y="548" font-family="Arial,sans-serif" font-size="9"
        fill="rgba(255,255,255,0.2)" letter-spacing="3" text-anchor="end">STUDIO</text>
</svg>