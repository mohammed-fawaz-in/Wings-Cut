<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">

  <!-- Sky gradient -->
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="60%" stop-color="#8B0000"/>
      <stop offset="100%" stop-color="#ff6b35"/>
    </linearGradient>
    <radialGradient id="sun" cx="70%" cy="28%" r="15%">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="softblur"><feGaussianBlur stdDeviation="40"/></filter>
    <radialGradient id="vign" cx="50%" cy="50%" r="70%"><stop offset="30%" stop-color="transparent"/><stop offset="100%" stop-color="rgba(0,0,0,0.75)"/></radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#sky)"/>
  <rect width="800" height="600" fill="url(#sun)"/>
  <!-- Bokeh lights -->
  <circle cx="100" cy="80" r="35" fill="#ffd700" opacity="0.07" filter="url(#softblur)"/>
  <circle cx="650" cy="60" r="50" fill="#ff9500" opacity="0.08" filter="url(#softblur)"/>
  <circle cx="750" cy="200" r="30" fill="#ffd700" opacity="0.06" filter="url(#softblur)"/>
  <circle cx="50" cy="350" r="40" fill="#ff6b35" opacity="0.07" filter="url(#softblur)"/>
  <!-- Mandap/Arch structure -->
  <rect x="220" y="120" width="12" height="280" fill="rgba(180,120,40,0.7)"/>
  <rect x="568" y="120" width="12" height="280" fill="rgba(180,120,40,0.7)"/>
  <path d="M 210 120 Q 400 60 590 120" stroke="rgba(180,120,40,0.8)" stroke-width="10" fill="none"/>
  <!-- Flower garlands on arch -->
  <path d="M 222 130 Q 320 100 400 90 Q 480 80 578 130" stroke="#e8b4b8" stroke-width="6" fill="none" opacity="0.8"/>
  <path d="M 222 145 Q 320 115 400 105 Q 480 95 578 145" stroke="#ff9eb5" stroke-width="4" fill="none" opacity="0.6"/>
  <!-- Flowers on garland -->
  <circle cx="280" cy="108" r="5" fill="#ff6b9d" opacity="0.9"/>
  <circle cx="340" cy="96" r="4" fill="#ffd700" opacity="0.9"/>
  <circle cx="400" cy="90" r="5" fill="#ff6b9d" opacity="0.9"/>
  <circle cx="460" cy="96" r="4" fill="#ffd700" opacity="0.9"/>
  <circle cx="520" cy="106" r="5" fill="#ff6b9d" opacity="0.9"/>
  <!-- Fabric drapes -->
  <path d="M 222 120 Q 260 200 250 280 L 240 280 Q 248 200 210 120 Z" fill="rgba(220,20,60,0.25)"/>
  <path d="M 578 120 Q 542 200 550 280 L 560 280 Q 552 200 590 120 Z" fill="rgba(220,20,60,0.25)"/>
  <!-- Groom silhouette -->
  <ellipse cx="365" cy="440" rx="38" ry="110" fill="rgba(15,10,5,0.85)"/>
  <circle cx="365" cy="305" r="38" fill="rgba(15,10,5,0.85)"/>
  <!-- Groom turban -->
  <ellipse cx="365" cy="275" rx="44" ry="24" fill="rgba(180,20,20,0.7)"/>
  <rect x="321" y="264" width="88" height="14" fill="rgba(180,20,20,0.6)" rx="4"/>
  <!-- Groom sherwani details -->
  <rect x="350" y="340" width="30" height="180" fill="rgba(30,15,0,0.6)"/>
  <line x1="365" y1="345" x2="365" y2="500" stroke="rgba(255,215,0,0.35)" stroke-width="2"/>
  <!-- Bride silhouette -->
  <ellipse cx="430" cy="450" rx="48" ry="100" fill="rgba(20,5,10,0.80)"/>
  <circle cx="430" cy="308" r="34" fill="rgba(20,5,10,0.80)"/>
  <!-- Bride lehenga - wide skirt -->
  <path d="M 382 400 Q 370 520 430 530 Q 490 520 478 400 Z" fill="rgba(180,20,60,0.35)"/>
  <!-- Bride dupatta/veil -->
  <path d="M 396 280 Q 350 320 340 420" stroke="rgba(255,180,200,0.4)" stroke-width="18" fill="none" stroke-linecap="round"/>
  <!-- Bride jewelry -->
  <circle cx="430" cy="285" r="3" fill="rgba(255,215,0,0.8)"/>
  <circle cx="420" cy="296" r="2" fill="rgba(255,215,0,0.7)"/>
  <circle cx="440" cy="296" r="2" fill="rgba(255,215,0,0.7)"/>
  <!-- Holding hands -->
  <path d="M 400 390 Q 412 402 420 395" stroke="rgba(15,10,5,0.7)" stroke-width="8" fill="none" stroke-linecap="round"/>
  <!-- Petals on ground -->
  <ellipse cx="280" cy="530" rx="4" ry="2" fill="#ff6b9d" opacity="0.6" transform="rotate(-20,280,530)"/>
  <ellipse cx="320" cy="540" rx="3" ry="2" fill="#ffd700" opacity="0.5" transform="rotate(15,320,540)"/>
  <ellipse cx="380" cy="535" rx="4" ry="2" fill="#ff6b9d" opacity="0.6" transform="rotate(5,380,535)"/>
  <ellipse cx="450" cy="538" rx="3" ry="2" fill="#ffd700" opacity="0.5" transform="rotate(-10,450,538)"/>
  <ellipse cx="510" cy="530" rx="4" ry="2" fill="#ff6b9d" opacity="0.6" transform="rotate(20,510,530)"/>
  <!-- Ground -->
  <rect x="0" y="510" width="800" height="90" fill="rgba(0,0,0,0.5)"/>
  <!-- Diyas/candles -->
  <circle cx="310" cy="512" r="5" fill="#ff8c00" opacity="0.7"/>
  <circle cx="310" cy="507" r="3" fill="#ffd700" opacity="0.9" filter="url(#glow)"/>
  <circle cx="490" cy="512" r="5" fill="#ff8c00" opacity="0.7"/>
  <circle cx="490" cy="507" r="3" fill="#ffd700" opacity="0.9" filter="url(#glow)"/>
  
  <!-- Vignette overlay -->
  <rect width="800" height="600" fill="url(#vign)"/>
  <!-- Top accent -->
  <rect x="0" y="0" width="800" height="3" fill="#ffd700" opacity="0.85"/>
  <!-- Bottom label panel -->
  <rect x="0" y="488" width="800" height="112" fill="rgba(0,0,0,0.72)"/>
  <rect x="0" y="488" width="800" height="1.5" fill="#ffd700" opacity="0.55"/>
  <!-- Accent bar -->
  <rect x="36" y="508" width="3.5" height="52" fill="#ffd700" opacity="0.9" rx="2">
    <animate attributeName="opacity" values="0.45;1;0.45" dur="2.8s" repeatCount="indefinite"/>
  </rect>
  <!-- Title -->
  <text x="52" y="534" font-family="Georgia,serif" font-size="21" font-weight="700"
        fill="white" letter-spacing="3" opacity="0.95">WEDDING CEREMONY</text>
  <text x="52" y="558" font-family="Arial,sans-serif" font-size="13"
        fill="rgba(255,255,255,0.52)" letter-spacing="1.5">A Day To Remember</text>
  <!-- Watermark -->
  <text x="764" y="530" font-family="Georgia,serif" font-size="11"
        fill="rgba(255,255,255,0.3)" letter-spacing="2" text-anchor="end">WINGS CUT</text>
  <text x="764" y="548" font-family="Arial,sans-serif" font-size="9"
        fill="rgba(255,255,255,0.2)" letter-spacing="3" text-anchor="end">STUDIO</text>
</svg>